DISABLE:
  - SPELL
DISABLE_LINTERS:
  # We prefer jq automatic formatting for JSON & YAML
  - JSON_PRETTIER
  - YAML_PRETTIER
  - HTML_HTMLHINT
  # Too much noise. Severity threshold can only be set via API key
  - REPOSITORY_CHECKOV
  # Slowest linter by far and overlaps with Trivy.
  - REPOSITORY_GRYPE
  # We do not need SBOMs.
  - REPOSITORY_SYFT
  - REPOSITORY_TRIVY_SBOM
ACTION_ZIZMOR_ARGUMENTS: >-
  --min-severity high
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
REPOSITORY_TRIVY_ARGUMENTS: --severity HIGH,CRITICAL
